<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chavez 國語生字表</title>
<style>
  :root {
    --c1: #FF6B6B; --c2: #FFD93D; --c3: #6BCB77; --c4: #4D96FF;
    --bg: #FFF9F0; --card-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "標楷體", "DFKai-SB", "BiauKai", serif; background: var(--bg); color: #333; }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; text-align: center; padding: 40px 20px 30px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; top: -40px; left: -40px;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .hero::after {
    content: ""; position: absolute; bottom: -60px; right: -30px;
    width: 250px; height: 250px; border-radius: 50%;
    background: rgba(255,255,255,.06);
  }
  .hero-icons { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin-bottom: 16px; position: relative; z-index: 1; }
  .hero-icons .pikachu { width: 90px; height: 90px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .hero-icons .star-deco { width: 38px; height: 38px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); animation: starBob 2s ease-in-out infinite; }
  @keyframes starBob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes pgBounce { 0%,100%{transform:translateY(0) scale(1)} 40%{transform:translateY(-14px) scale(1.05)} 60%{transform:translateY(-8px) scale(1.02)} }
  .tab-btn img { width: 22px; height: 22px; vertical-align: middle; }
  .hero h1 { font-size: 2.6rem; letter-spacing: 6px; text-shadow: 0 2px 10px rgba(0,0,0,.3); position: relative; z-index: 1; }
  .hero p  { font-size: 1.15rem; margin-top: 10px; opacity: .88; letter-spacing: 2px; position: relative; z-index: 1; }

  /* NAV TABS */
  .tab-bar {
    display: flex; justify-content: center; gap: 14px;
    padding: 20px 16px; background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.07); position: sticky; top: 0; z-index: 100;
  }
  .tab-btn {
    font-size: 1.15rem; font-family: inherit;
    padding: 11px 28px; border-radius: 50px; border: 2.5px solid transparent;
    cursor: pointer; transition: all .2s; font-weight: bold;
    display: flex; align-items: center; gap: 7px;
  }
  .tab-btn.list   { background: #EEF2FF; color: #4D96FF; border-color: #4D96FF; }
  .tab-btn.search { background: #FFF0F0; color: #FF6B6B; border-color: #FF6B6B; }
  .tab-btn.quiz   { background: #FFF0F7; color: #e91e8c; border-color: #f06292; }
  .tab-btn.list.active   { background: #4D96FF; color: white; }
  .tab-btn.search.active { background: #FF6B6B; color: white; }
  .tab-btn.quiz.active   { background: linear-gradient(135deg,#ffb6c1,#f06292); color: white; border-color: #f06292; }

  /* STATS */
  .stats-bar {
    display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
    padding: 14px 16px; background: white; border-bottom: 1px solid #eee;
  }
  .stat-item { text-align: center; }
  .stat-num  { font-size: 1.8rem; font-weight: bold; }
  .stat-num.c1 { color: #FF6B6B; }
  .stat-num.c2 { color: #4D96FF; }
  .stat-num.c3 { color: #3AAB4A; }
  .stat-label  { font-size: .85rem; color: #888; margin-top: 2px; }
  .stat-star   { width: 18px; height: 18px; vertical-align: middle; margin-right: 4px; }

  /* FILTER */
  .filter-bar {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; padding: 18px 16px; background: var(--bg);
  }
  .sem-btn {
    font-size: 1.05rem; font-family: inherit;
    padding: 9px 22px; border-radius: 50px; border: 2px solid transparent;
    cursor: pointer; font-weight: bold; transition: all .2s;
  }
  .sem-all { background: #e8e8e8; color: #555; border-color: #ccc; }
  .sem-1上 { background: #FFE5E5; color: #c0392b; border-color: #FF6B6B; }
  .sem-1下 { background: #E5F4FF; color: #1a5fa0; border-color: #4D96FF; }
  .sem-2上 { background: #E5FFE8; color: #1e7a30; border-color: #6BCB77; }
  .sem-2下 { background: #FFF5E5; color: #b35a00; border-color: #FFB347; }
  .sem-btn.active { filter: brightness(.85); transform: scale(1.06); box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .print-btn {
    font-size: 1.05rem; font-family: inherit;
    padding: 9px 22px; border-radius: 50px; border: 2px solid #9b59b6;
    cursor: pointer; font-weight: bold; transition: all .2s;
    background: #F9F0FF; color: #7d3c98;
  }
  .print-btn:hover { background: #9b59b6; color: white; }

  /* SEMESTER LABEL */
  .semester-label {
    font-size: 1.25rem; font-weight: bold; margin: 18px 0 12px;
    padding: 7px 20px; border-radius: 50px; display: inline-block;
  }
  .sem-label-一上 { background: #FFE5E5; color: #c0392b; }
  .sem-label-一下 { background: #E5F4FF; color: #1a5fa0; }
  .sem-label-二上 { background: #E5FFE8; color: #1e7a30; }
  .sem-label-二下 { background: #FFF5E5; color: #b35a00; }

  /* GRID */
  .section { padding: 8px 16px 32px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 14px;
  }
  .card {
    background: white; border-radius: 18px; padding: 16px 12px 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center;
    transition: transform .15s, box-shadow .15s;
    border-top: 5px solid #4D96FF;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.13); }
  .card.sem-一上 { border-color: #FF6B6B; }
  .card.sem-一下 { border-color: #4D96FF; }
  .card.sem-二上 { border-color: #6BCB77; }
  .card.sem-二下 { border-color: #FFB347; }

  .card-num    { font-size: .78rem; color: #bbb; margin-bottom: 2px; }
  .card-char-wrap { display: flex; align-items: center; justify-content: center; margin: 4px 0 2px; gap: 1px; }
  .card-char      { font-size: 3.2rem; line-height: 1; color: #222; }
  .card-zhuyin-col{ display: inline-flex; align-items: stretch; }
  .card-radical {
    font-size: .88rem; color: #999; margin: 4px 0 10px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .card-radical span { font-size: 1.05rem; color: #555; font-weight: bold; }
  .card-words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .word-tag {
    font-size: 1rem; border-radius: 20px; padding: 4px 11px;
    background: #F0F4FF; color: #4D6FA8;
  }
  .card.sem-一上 .word-tag { background: #FFF0F0; color: #a03030; }
  .card.sem-一下 .word-tag { background: #EFF6FF; color: #1a5fa0; }
  .card.sem-二上 .word-tag { background: #EFFFEF; color: #1a7030; }
  .card.sem-二下 .word-tag { background: #FFF8EE; color: #8a4500; }

  /* SEARCH PAGE */
  .search-section {
    max-width: 600px; margin: 40px auto; padding: 0 20px;
    display: none;
  }
  .search-box-wrap { display: flex; gap: 10px; margin-bottom: 28px; }
  #searchInput {
    flex: 1; font-size: 2.2rem; font-family: inherit;
    text-align: center; border: 3px solid #ddd; border-radius: 16px;
    padding: 12px 16px; outline: none; transition: border .2s;
    letter-spacing: 10px; background: white;
  }
  #searchInput:focus { border-color: #FF6B6B; box-shadow: 0 0 0 4px rgba(255,107,107,.15); }
  #searchBtn {
    font-size: 1.15rem; font-family: inherit;
    background: #FF6B6B; color: white; border: none;
    border-radius: 16px; padding: 12px 26px; cursor: pointer;
    font-weight: bold; transition: background .2s; white-space: nowrap;
  }
  #searchBtn:hover { background: #e05555; }

  .result-box {
    border-radius: 22px; padding: 32px 24px; text-align: center;
    animation: popIn .3s ease;
  }
  @keyframes popIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result-yes { background: linear-gradient(135deg, #EFFFEF, #C8F7D0); border: 2.5px solid #6BCB77; }
  .result-no  { background: linear-gradient(135deg, #FFF5F5, #FFE0E0); border: 2.5px solid #FF6B6B; }
  .result-icon  { font-size: 4rem; }
  .result-char  { font-size: 4.5rem; margin: 10px 0 6px; }
  .result-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 14px; }
  .result-yes .result-title { color: #2e7d32; }
  .result-no  .result-title { color: #c0392b; }
  .result-meta  { font-size: 1rem; color: #555; margin-bottom: 12px; line-height: 1.7; }
  .result-words { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .result-word-tag {
    font-size: 1.05rem; background: white; border-radius: 20px;
    padding: 5px 16px; box-shadow: 0 2px 6px rgba(0,0,0,.1);
  }
  .hint { text-align: center; color: #bbb; font-size: 1rem; margin-top: 20px; line-height: 2; }

  /* QUIZ PAGE */
  .quiz-section { display:none; padding:24px 16px 48px; }
  .qz-wrap { max-width:420px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .qz-prog-bg { width:100%; background:#fdd; border-radius:20px; height:10px; overflow:hidden; }
  .qz-prog-fill { height:100%; background:linear-gradient(90deg,#ffb6c1,#f06292); border-radius:20px; transition:width .45s cubic-bezier(.4,0,.2,1); }
  .qz-prog-text { font-size:.95rem; color:#aaa; }
  .qz-card {
    background:white; border-radius:22px; padding:24px 20px;
    box-shadow:0 6px 28px rgba(0,0,0,.1); width:100%;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .qz-word-display {
    display:flex; align-items:flex-end; gap:10px;
    padding:12px 26px; background:#FFF9F0;
    border-radius:14px; border:2px solid #FFE5C8;
  }
  .qz-ch { font-size:3rem; color:#333; line-height:1; min-width:1em; text-align:center; }
  .qz-blank-group { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .qz-blank-zy { font-size:1rem; color:#c0392b; font-weight:bold; letter-spacing:2px; line-height:1; }
  .qz-blank {
    width:3rem; height:3rem; border:3px dashed #f06292;
    border-radius:8px; background:white;
    animation:qzBlink 1.4s ease-in-out infinite;
  }
  @keyframes qzBlink {
    0%,100%{ border-color:#f06292; }
    50%{ border-color:#fbb; background:#fff5f8; }
  }
  .qz-hint { font-size:.95rem; color:#aaa; min-height:1.4rem; text-align:center; }
  #qzCanvas { display:block; border:3px solid #f06292; border-radius:14px; cursor:crosshair; touch-action:none; }
  #qzEraserCursor { display:none; position:absolute; border:2px solid #999; border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); background:rgba(160,160,160,.15); box-sizing:border-box; }
  .qz-btn-row { display:flex; gap:14px; }
  .qz-btn {
    font-size:1.12rem; font-family:inherit; padding:12px 30px;
    border-radius:50px; border:none; cursor:pointer; font-weight:bold;
    transition:transform .12s; letter-spacing:1px;
  }
  .qz-btn:active { transform:scale(.92); }
  .qz-clear  { background:#f0f0f0; color:#666; }
  .qz-submit { background:linear-gradient(135deg,#ffb6c1,#f06292); color:white; box-shadow:0 4px 14px rgba(240,98,146,.4); }
  .qz-result { width:100%; display:none; flex-direction:column; align-items:center; gap:12px; }
  .qz-result-label { font-size:1.1rem; color:#555; }
  .qz-self-row { display:flex; gap:16px; }
  .qz-ok { font-size:1.1rem; font-family:inherit; padding:11px 26px; border-radius:50px; cursor:pointer; font-weight:bold; transition:all .15s; background:#d4f5d4; color:#1a6b28; border:2.5px solid #6BCB77; }
  .qz-ok:hover { background:#6BCB77; color:white; }
  .qz-ng { font-size:1.1rem; font-family:inherit; padding:11px 26px; border-radius:50px; cursor:pointer; font-weight:bold; transition:all .15s; background:#FFE5E5; color:#c0392b; border:2.5px solid #FF6B6B; }
  .qz-ng:hover { background:#FF6B6B; color:white; }
  .qz-score { display:none; flex-direction:column; align-items:center; gap:10px; background:white; border-radius:22px; padding:36px 28px; width:100%; box-shadow:0 6px 28px rgba(0,0,0,.1); text-align:center; }

  /* QUIZ PEN TOOLBAR */
  .qz-toolbar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:#fafafa; border-radius:50px; border:1.5px solid #eee; }
  .qz-color-swatch { width:26px; height:26px; border-radius:50%; border:3px solid transparent; cursor:pointer; transition:all .15s; flex-shrink:0; outline:none; }
  .qz-color-swatch.active { border-color:#f06292 !important; transform:scale(1.22); box-shadow:0 0 0 2px #fff,0 0 0 4px #f06292; }
  .qz-eraser-label { font-size:.75rem; color:#aaa; white-space:nowrap; }
  .qz-eraser-size { display:flex; align-items:center; justify-content:center; border-radius:50%; border:2.5px solid #ddd; background:white; cursor:pointer; transition:all .15s; padding:0; flex-shrink:0; }
  .qz-eraser-size::after { content:''; display:block; border-radius:50%; background:#bbb; transition:all .15s; }
  .qz-eraser-size.active { border-color:#f06292; background:#fff0f7; }
  .qz-eraser-size.active::after { background:#f06292; }
  .qz-eraser-size.es { width:28px; height:28px; } .qz-eraser-size.es::after { width:7px;  height:7px;  }
  .qz-eraser-size.em { width:30px; height:30px; } .qz-eraser-size.em::after { width:13px; height:13px; }
  .qz-eraser-size.el { width:33px; height:33px; } .qz-eraser-size.el::after { width:21px; height:21px; }
  .qz-tool-sep { width:1.5px; height:20px; background:#ddd; border-radius:1px; }

  /* CELEBRATION OVERLAY */
  .qz-celebration { display:none; position:fixed; inset:0; z-index:9999; background:rgba(255,255,255,.90); flex-direction:column; align-items:center; justify-content:center; gap:14px; cursor:pointer; }
  .qz-celebration.show { display:flex; animation:qzFadeIn .25s ease; }
  .qz-celeb-img { width:200px; height:200px; object-fit:contain; animation:qzPop .42s cubic-bezier(.36,.07,.19,.97) both; }
  .qz-celeb-char { font-size:3.5rem; font-weight:bold; color:#f06292; line-height:1; animation:qzPop .42s .1s cubic-bezier(.36,.07,.19,.97) both; }
  .qz-celeb-text { font-size:1.6rem; font-weight:bold; color:#f06292; letter-spacing:2px; animation:qzFadeUp .4s .2s ease both; }
  .qz-celeb-sub { font-size:.85rem; color:#bbb; animation:qzFadeUp .4s .35s ease both; }
  @keyframes qzPop { 0%{transform:scale(0) rotate(-15deg);opacity:0} 60%{transform:scale(1.18) rotate(4deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
  @keyframes qzFadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes qzFadeIn { from{opacity:0} to{opacity:1} }
  .qz-confetti { position:fixed; border-radius:2px; pointer-events:none; z-index:10000; animation:qzFall linear forwards; }
  @keyframes qzFall { from{transform:translateY(-30px) rotate(0deg);opacity:1} to{transform:translateY(110vh) rotate(720deg);opacity:0} }

  /* LESSON BUTTONS */
  .lesson-btn {
    font-size: .9rem; font-family: inherit;
    padding: 6px 16px; border-radius: 50px; border: 2px solid transparent;
    cursor: pointer; font-weight: bold; transition: all .2s;
    background: #f0f0f0; color: #555; border-color: #ccc;
  }
  .lesson-btn.active { filter: brightness(.85); transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .lesson-btn.sem-1上 { background: #FFE5E5; color: #c0392b; border-color: #FF6B6B; }
  .lesson-btn.sem-1下 { background: #E5F4FF; color: #1a5fa0; border-color: #4D96FF; }
  .lesson-btn.sem-2上 { background: #E5FFE8; color: #1e7a30; border-color: #6BCB77; }
  .lesson-btn.sem-2下 { background: #FFF5E5; color: #b35a00; border-color: #FFB347; }
  /* QUIZ SETUP LESSON BTNS */
  .qz-setup-card {
    width: 100%; background: white; border-radius: 16px;
    padding: 14px 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  .qz-setup-label {
    font-size: .82rem; color: #bbb; letter-spacing: 1px; margin-bottom: 10px;
  }
  .qz-lesson-btn {
    font-size: .9rem; font-family: inherit; width: 100%;
    padding: 7px 4px; border-radius: 10px; border: 2px solid #f06292;
    cursor: pointer; font-weight: bold; transition: all .2s; text-align: center;
    background: #fff0f7; color: #e91e8c;
  }
  .qz-lesson-btn.active { background: #f06292; color: white; }
  .qz-lesson-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px;
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    .hero h1 { font-size: 2rem; }
    .hero-icons img { width: 50px; height: 50px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .card-char { font-size: 2.7rem; }
    .tab-btn { font-size: 1rem; padding: 9px 20px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-icons">
    <img class="star-deco" src="star.png" alt="star">
    <img class="pikachu"   src="pikachu.png" alt="pikachu">
    <img class="star-deco" src="star.png" alt="star" style="animation-delay:.8s;">
  </div>
  <h1>國語生字表</h1>
  <p>康軒版　一上 ▸ 一下 ▸ 二上 ▸ 二下</p>
</div>


<div class="tab-bar">
  <button class="tab-btn list active" onclick="switchTab('list')"><img src="book.png" alt=""> 生字列表</button>
  <button class="tab-btn search" onclick="switchTab('search')">🔍 查詢生字</button>
  <button class="tab-btn quiz" onclick="switchTab('quiz')"><img src="bullbasaur.png" alt="" style="width:22px;height:22px;vertical-align:middle;"> 生字挑戰</button>
</div>

<!-- LIST PAGE -->
<div id="listPage">
  <div class="filter-bar" id="semFilterBar">
    <button class="sem-btn sem-all active" data-sem="all"  onclick="filterSem('all',this)">全部</button>
    <button class="sem-btn sem-1上"        data-sem="一上" onclick="filterSem('一上',this)">一上</button>
    <button class="sem-btn sem-1下"        data-sem="一下" onclick="filterSem('一下',this)">一下</button>
    <button class="sem-btn sem-2上"        data-sem="二上" onclick="filterSem('二上',this)">二上</button>
    <button class="sem-btn sem-2下"        data-sem="二下" onclick="filterSem('二下',this)">二下</button>
    <button class="print-btn" onclick="openPractice()"><img src="paper.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:4px;"> 列印練習單</button>
  </div>
  <div class="filter-bar" id="lessonFilterBar" style="display:none;padding-top:0;"></div>
  <div class="section" id="charGrid"></div>
</div>

<!-- SEARCH PAGE -->
<div class="search-section" id="searchPage">
  <div style="text-align:center;margin-bottom:18px;">
    <img src="pokemon-go.png" alt="pokemon-go" style="width:90px;height:90px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));">
  </div>
  <div class="search-box-wrap">
    <input id="searchInput" type="text" maxlength="1" placeholder="輸入一個字">
    <button id="searchBtn" onclick="doSearch()">查詢</button>
  </div>
  <div id="searchResult"></div>
  <p class="hint">輸入一個國字，查看是否已學過 ✨<br>支援鍵盤 Enter 快速查詢</p>
</div>

<!-- QUIZ PAGE -->
<div class="quiz-section" id="quizPage">
  <div class="qz-wrap">
    <!-- Setup screen -->
    <div id="qzSetup" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="font-size:1.6rem;font-weight:bold;color:#f06292;letter-spacing:2px;">選擇範圍</div>
      <div class="qz-setup-card">
        <div class="qz-setup-label">學期</div>
        <div style="display:flex;justify-content:center;gap:8px;" id="qzSetupSemBtns">
          <button class="sem-btn sem-all active" data-sem="all"  onclick="qzSetupSem('all',this)">全部</button>
          <button class="sem-btn sem-1上"        data-sem="一上" onclick="qzSetupSem('一上',this)">一上</button>
          <button class="sem-btn sem-1下"        data-sem="一下" onclick="qzSetupSem('一下',this)">一下</button>
          <button class="sem-btn sem-2上"        data-sem="二上" onclick="qzSetupSem('二上',this)">二上</button>
          <button class="sem-btn sem-2下"        data-sem="二下" onclick="qzSetupSem('二下',this)">二下</button>
        </div>

// 從 Set 產生課次標籤文字
function lessonLabel(lessonSet, sem) {
  if (!lessonSet.size) return '';
  const sorted = [...lessonSet].sort((a,b) => a - b);
  if (sorted.length === 1) {
    const n = sorted[0];
    const item = DATA.find(d => d.lesson === n && d.lessonTitle && (!sem || d.semester === sem));
    const title = item ? item.lessonTitle : '';
    return '　第' + n + '課' + (title ? '「' + title + '」' : '');
  }
  return '　第' + sorted.join('、') + '課';
}

  const grid = document.getElementById('charGrid');

  sems.forEach(sem => {

function filterLesson(lesson, btn) {

// ── 注音排版輔助（聲調對應位置） ──
// size: CSS 值字串，例如 "0.85rem" 或 "5.5mm"
function zhuyinHtml(zhuyin, size) {
  if (!zhuyin) return '';
  // 1聲無符號；2聲頂；3聲中；4聲底；輕聲頂
  const toneAlign = { 'ˊ': 'flex-start', 'ˇ': 'center', 'ˋ': 'flex-end', '˙': 'flex-start' };
  let tone = '', phonetic = zhuyin;
  for (const mark of Object.keys(toneAlign)) {
    if (zhuyin.endsWith(mark)) { tone = mark; phonetic = zhuyin.slice(0, -1); break; }
  }
  const align = toneAlign[tone] || '';
  const toneCol = tone
    ? `<div style="display:flex;flex-direction:column;justify-content:${align};
                   font-size:${size};color:#c0392b;line-height:1;
                   align-self:stretch;overflow:hidden;">${tone}</div>`
    : '';
  return `<div style="display:inline-flex;align-items:stretch;max-height:100%;overflow:hidden;">
    <div style="writing-mode:vertical-rl;text-orientation:upright;
                font-size:${size};color:#c0392b;line-height:1.1;
                overflow:hidden;max-height:100%;">${phonetic}</div>
    ${toneCol}
  </div>`;
}

// ── 列印練習單 ──
function openPractice() {
  const filter = currentListSem || 'all';
  const lessonSet = currentListLesson instanceof Set ? currentListLesson : new Set();
  let chars = filter === 'all' ? [...DATA] : DATA.filter(d => d.semester === filter);
  if (lessonSet.size > 0) chars = chars.filter(d => lessonSet.has(d.lesson));
  let label = filter === 'all' ? '全部' : ('康軒' + filter);
  label += lessonLabel(lessonSet, filter !== 'all' ? filter : null).replace(/^　/, ' ');

  // 版面：A4 可用寬約 180mm（含瀏覽器列印安全邊界）
  // 每組 = 字格(SQ) + 注音細欄(NW) + 練習×3(SQ×3) = 4SQ+NW
  // 兩組 + 間距：2×(4×19+7) + 6 = 2×83 + 6 = 172mm（安全不超出）
  const SQ  = 19;   // 字格 / 練習格邊長 mm
  const NW  = 7;    // 注音細欄寬 mm
  const GAP = 6;    // 兩組間距 mm
  const ZF  = '4mm'; // 注音字級
  const GROUPS_PER_ROW = 2;
  const TOTAL = GROUPS_PER_ROW * (4 * SQ + NW) + (GROUPS_PER_ROW - 1) * GAP; // 172mm

  // 字格（田字格，灰底，不含注音）
  function charTd(d) {
    return `<td style="height:${SQ}mm;border:1.8px solid #555;background:#f5f5f5;padding:0;position:relative;">
      <div style="position:absolute;top:50%;left:0;right:0;border-top:1px dashed #ccc;"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #ccc;"></div>
      <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:${(SQ*0.78).toFixed(1)}mm;line-height:1;color:#111;">${d.char}</span>
      </div>
    </td>`;
  }

  // 注音細欄（獨立窄格，絕對定位確保不溢出）
  function zhuyinTd(d) {
    return `<td style="height:${SQ}mm;border:1.8px solid #555;border-left:none;background:#fafafa;padding:0;overflow:hidden;position:relative;">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;">
        ${zhuyinHtml(d.zhuyin, ZF)}
      </div>
    </td>`;
  }

  // 練習格（白底田字格）
  function practiceTd() {
    return `<td style="height:${SQ}mm;border:1.8px solid #555;background:white;padding:0;position:relative;">
      <div style="position:absolute;top:50%;left:0;right:0;border-top:1px dashed #ddd;"></div>
      <div style="position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #ddd;"></div>
    </td>`;
  }

  function spacer() { return `<td></td>`; }

  // 建立 colgroup（每組 5 欄：字+注音+練×3，兩組中間 1 spacer，共 11 欄）
  // 直接用 mm 單位，避免百分比在列印時計算偏差
  let cg = '<colgroup>';
  for (let g = 0; g < GROUPS_PER_ROW; g++) {
    cg += `<col style="width:${SQ}mm"><col style="width:${NW}mm"><col style="width:${SQ}mm"><col style="width:${SQ}mm"><col style="width:${SQ}mm">`;
    if (g < GROUPS_PER_ROW - 1) cg += `<col style="width:${GAP}mm">`;
  }
  cg += '</colgroup>';

  let rows = '';
  for (let i = 0; i < chars.length; i += GROUPS_PER_ROW) {
    const group = chars.slice(i, i + GROUPS_PER_ROW);

    // 格子行
    rows += '<tr style="page-break-inside:avoid;">';
    for (let g = 0; g < GROUPS_PER_ROW; g++) {
      const d = group[g];
      if (d) {
        rows += charTd(d);
        rows += zhuyinTd(d);
        rows += practiceTd();
        rows += practiceTd();
        rows += practiceTd();
      } else {
        rows += `<td colspan="5"></td>`;
      }
      if (g < GROUPS_PER_ROW - 1) rows += spacer();
    }
    rows += '</tr>';

    // 詞語行
    rows += '<tr>';
    for (let g = 0; g < GROUPS_PER_ROW; g++) {
      const d = group[g];
      rows += `<td colspan="5" style="font-size:8pt;color:#666;padding:2px 2px 8px;vertical-align:top;">`;
      if (d) rows += `部首：${d.radical}　${d.words.join('、')}`;
      rows += '</td>';
      if (g < GROUPS_PER_ROW - 1) rows += spacer();
    }
    rows += '</tr>';
  }

  const html = `<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>國語練習單 - ${label}</title>
<style>
  @page { size: A4 portrait; margin: 12mm 10mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "標楷體","DFKai-SB","BiauKai",serif; }
  h2 { text-align:center; font-size:14pt; margin-bottom:10px; letter-spacing:2px; }
  .sub { text-align:center; font-size:9pt; color:#888; margin-bottom:14px; }
  table { border-collapse:collapse; width:${TOTAL}mm; table-layout:fixed; }
  @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<h2>國語練習單　${label}</h2>
<p class="sub">共 ${chars.length} 個生字　▸ 每字提供 3 格練習空間</p>
<table>
  ${cg}
  <tbody>${rows}</tbody>
</table>
<script>window.onload=function(){window.print();}<\/script>
</body>
</html>`;

  const win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
}

let qzDrawing = false, qzLX = 0, qzLY = 0;
let qzCtx = null;
let qzSetupSelectedSem = 'all';
let qzSetupSelectedLesson = new Set();
let qzPenColor = '#1a1a2e';
let qzIsEraser = false;
let qzEraserSize = 24;
let qzStrokes = [], qzCurrentStroke = null, qzEraserUsed = false;
let qzCelebTimeout = null;

function qzInit() {
  qzCtx = document.getElementById('qzCanvas').getContext('2d');
  const cv = document.getElementById('qzCanvas');
  const getP = e => {
    const r = cv.getBoundingClientRect();
    const sx = cv.width / r.width, sy = cv.height / r.height;
    const s = e.touches ? e.touches[0] : e;
    return { x: (s.clientX - r.left) * sx, y: (s.clientY - r.top) * sy };
  };
  const qzStrokeEnd = () => {
    qzDrawing = false;
    if (qzCurrentStroke && qzCurrentStroke.length > 0) { qzStrokes.push(qzCurrentStroke); qzCurrentStroke = null; }
  };
  const qzPenDown = p => {
    if (qzIsEraser) { qzEraserUsed = true; return; }
    qzCtx.beginPath(); qzCtx.arc(p.x,p.y,3.5,0,Math.PI*2); qzCtx.fillStyle=qzPenColor; qzCtx.fill();
    qzCurrentStroke = [{x:p.x,y:p.y,t:Date.now()}];
  };
  const qzPenMove = p => {
    qzCtx.beginPath(); qzCtx.moveTo(qzLX,qzLY); qzCtx.lineTo(p.x,p.y);
    if (qzIsEraser) {
      qzCtx.strokeStyle='white'; qzCtx.lineWidth=qzEraserSize;
    } else {
      qzCtx.strokeStyle=qzPenColor; qzCtx.lineWidth=7;
      if (qzCurrentStroke) qzCurrentStroke.push({x:p.x,y:p.y,t:Date.now()});
    }
    qzCtx.lineCap='round'; qzCtx.lineJoin='round'; qzCtx.stroke();
  };
  cv.addEventListener('mousedown',  e => { qzDrawing=true; const p=getP(e); qzLX=p.x; qzLY=p.y; qzPenDown(p); });
  cv.addEventListener('mousemove',  e => { if(!qzDrawing)return; const p=getP(e); qzPenMove(p); qzLX=p.x; qzLY=p.y; });
  cv.addEventListener('mouseup',    qzStrokeEnd);
  cv.addEventListener('mouseleave', qzStrokeEnd);
  cv.addEventListener('touchstart', e => { e.preventDefault(); qzDrawing=true; const p=getP(e); qzLX=p.x; qzLY=p.y; qzPenDown(p); }, {passive:false});
  cv.addEventListener('touchmove',  e => { if(!qzDrawing)return; e.preventDefault(); const p=getP(e); qzPenMove(p); qzLX=p.x; qzLY=p.y; }, {passive:false});
  cv.addEventListener('touchend',   qzStrokeEnd);
  // Eraser cursor tracking
  const ec = document.getElementById('qzEraserCursor');
  const moveCursor = e => {
    if (!qzIsEraser) { ec.style.display='none'; return; }
    const r = cv.getBoundingClientRect();
    const ratio = r.width / cv.width;
    const src = e.touches ? e.touches[0] : e;
    const x = src.clientX - r.left, y = src.clientY - r.top;
    const sz = qzEraserSize * ratio;
    ec.style.cssText = `display:block;width:${sz}px;height:${sz}px;left:${x}px;top:${y}px;`;
  };
  cv.addEventListener('mousemove',  moveCursor);
  cv.addEventListener('touchmove',  moveCursor, {passive:false});
  cv.addEventListener('mouseleave', () => { ec.style.display='none'; });
  cv.addEventListener('touchend',   () => { ec.style.display='none'; }, {passive:true});
  // Show setup screen; do NOT start quiz yet
  qzShowSetup();
}

function qzDrawGrid() {
  const cv = document.getElementById('qzCanvas');
  const W = cv.width, H = cv.height;
  qzCtx.fillStyle = 'white'; qzCtx.fillRect(0,0,W,H);
  qzCtx.save();
  qzCtx.strokeStyle='#fdd'; qzCtx.lineWidth=1.5; qzCtx.setLineDash([6,6]);
  qzCtx.beginPath(); qzCtx.moveTo(W/2,4); qzCtx.lineTo(W/2,H-4); qzCtx.moveTo(4,H/2); qzCtx.lineTo(W-4,H/2); qzCtx.stroke();
  qzCtx.setLineDash([]); qzCtx.strokeStyle='#f06292'; qzCtx.lineWidth=2.5;
  qzCtx.strokeRect(2,2,W-4,H-4); qzCtx.restore();
}

function qzClear() { qzDrawGrid(); qzStrokes = []; qzCurrentStroke = null; qzEraserUsed = false; }

function qzBuild(sem, lessonSet) {
  sem = sem || 'all';
  if (!(lessonSet instanceof Set)) lessonSet = new Set();
  let pool = sem === 'all' ? [...DATA] : DATA.filter(d => d.semester === sem);
  if (lessonSet.size > 0) pool = pool.filter(d => lessonSet.has(d.lesson));
  pool = pool.sort(() => Math.random() - 0.5);
  qzQuestions = pool.map(item => {
    const word = item.words[Math.floor(Math.random() * item.words.length)];
    const idx  = word.indexOf(item.char);
    return { char: item.char, zhuyin: item.zhuyin, word, blankIdx: idx >= 0 ? idx : 0 };
  });
}

function qzShow() {
  const q = qzQuestions[qzIdx];
  const display = document.getElementById('qzWordDisplay');
  display.innerHTML = '';
  for (let i = 0; i < q.word.length; i++) {
    if (i === q.blankIdx) {
      const g = document.createElement('div'); g.className = 'qz-blank-group';
      g.innerHTML = `<div class="qz-blank-zy">${q.zhuyin}</div><div class="qz-blank"></div>`;
      display.appendChild(g);
    } else {
      const s = document.createElement('span'); s.className = 'qz-ch';
      s.textContent = q.word[i]; display.appendChild(s);
    }
  }
  const total = qzQuestions.length;
  document.getElementById('qzFill').style.width = (qzIdx / total * 100) + '%';
  document.getElementById('qzText').textContent = `第 ${qzIdx+1} 題 / 共 ${total} 題`;
  document.getElementById('qzHint').textContent = '請在下方方格寫出空白的字 ✍️';
  document.getElementById('qzResult').style.display = 'none';
  document.getElementById('qzActionRow').style.display = 'flex';
  document.getElementById('qzScore').style.display = 'none';
  document.getElementById('qzCard').style.display = 'flex';
  qzDrawGrid();
  qzStrokes = []; qzCurrentStroke = null; qzEraserUsed = false;
}

async function qzSubmit() {
  const cv = document.getElementById('qzCanvas');
  const d = qzCtx.getImageData(0,0,cv.width,cv.height).data;
  let ink = 0;
  for (let i=0; i<d.length; i+=4) if (d[i]<230 || d[i+1]<230 || d[i+2]<230) ink++;
  if (ink/(cv.width*cv.height) < 0.01) {
    document.getElementById('qzHint').textContent = '還沒寫喔！請先在格子裡寫字 ✍️';
    return;
  }
  const q = qzQuestions[qzIdx];

  // Try Web Handwriting Recognition API (Chrome 99+)
  if (!qzEraserUsed && qzStrokes.length > 0 && 'createHandwritingRecognizer' in navigator) {
    document.getElementById('qzHint').textContent = '辨識中…';
    document.getElementById('qzActionRow').style.display = 'none';
    try {
      const recognizer = await navigator.createHandwritingRecognizer({ languages: ['zh-TW'] });
      const drawing = recognizer.startDrawing({ hints: { recognitionType: 'text', inputType: 'mouse', alternatives: 8 } });
      for (const pts of qzStrokes) {
        const stroke = new HandwritingStroke();
        pts.forEach(pt => stroke.addPoint(pt));
        drawing.addStroke(stroke);
      }
      const preds = await drawing.getPrediction();
      recognizer.finish();
      if (preds.some(p => p.text.trim() === q.char)) {
        qzCorrect++;
        qzIdx++;
        qzPlaySuccess();
        qzShowCelebration(q.char);
        return;
      }
    } catch(e) { /* API not available, fallback */ }
    document.getElementById('qzActionRow').style.display = 'flex';
  }

  // Fallback: show reference character for self-assessment
  qzCtx.save(); qzCtx.globalAlpha=0.28; qzCtx.fillStyle='#c0392b';
  qzCtx.font = `${Math.floor(cv.width*0.70)}px "標楷體","DFKai-SB",serif`;
  qzCtx.textAlign='center'; qzCtx.textBaseline='middle';
  qzCtx.fillText(q.char, cv.width/2, cv.height/2); qzCtx.restore();
  document.getElementById('qzHint').textContent = `紅色是正確的「${q.char}」，和你寫的比一比 👆`;
  document.getElementById('qzResult').style.display = 'flex';
  document.getElementById('qzActionRow').style.display = 'none';
}

function qzMark(ok) {
  const char = qzQuestions[qzIdx].char;
  qzIdx++;
  if (ok) {
    qzCorrect++;
    qzPlaySuccess();
    qzShowCelebration(char);
  } else {
    if (qzIdx >= qzQuestions.length) qzShowScore();
    else qzShow();
  }
}

function qzShowScore() {
  document.getElementById('qzCard').style.display = 'none';
  document.getElementById('qzFill').style.width = '100%';
  document.getElementById('qzText').textContent = '完成！';
  const total = qzQuestions.length;
  const pct = qzCorrect / total;
  const emoji = pct>=.9?'🏆':pct>=.7?'🌟':pct>=.5?'😊':'💪';
  const msg   = pct>=.9?'太棒了！':pct>=.7?'寫得很好！':pct>=.5?'不錯喔！繼續加油！':'多練習，你會越來越好！';
  document.getElementById('qzSEmoji').textContent = emoji;
  document.getElementById('qzSNum').textContent   = qzCorrect;
  document.getElementById('qzSSub').textContent   = `/ ${total} 題答對`;
  document.getElementById('qzSMsg').textContent   = msg;
  document.getElementById('qzScore').style.display = 'flex';
}

function qzRestart() {
  qzIdx = 0; qzCorrect = 0;
  qzBuild(qzSetupSelectedSem, qzSetupSelectedLesson);
  qzShow();
}

// ── 色筆 / 橡皮擦工具 ──
function qzSetColor(color, btn) {
  qzPenColor = color; qzIsEraser = false;
  document.querySelectorAll('.qz-color-swatch').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.qz-eraser-size').forEach(b => b.classList.remove('active'));
  document.getElementById('qzCanvas').style.cursor = 'crosshair';
  document.getElementById('qzEraserCursor').style.display = 'none';
}
function qzSetEraser(size, btn) {
  const cv = document.getElementById('qzCanvas');
  const ec = document.getElementById('qzEraserCursor');
  if (qzIsEraser && qzEraserSize === size) {
    qzIsEraser = false;
    btn.classList.remove('active');
    cv.style.cursor = 'crosshair';
    ec.style.display = 'none';
    document.querySelectorAll('.qz-color-swatch').forEach(b => {
      if (b.style.background === qzPenColor) b.classList.add('active');
    });
  } else {
    qzIsEraser = true; qzEraserSize = size;
    document.querySelectorAll('.qz-color-swatch').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.qz-eraser-size').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cv.style.cursor = 'none';
  }
}

// ── 慶祝動畫 ──
function qzShowCelebration(char) {
  const src = QZ_PIKACHU[Math.floor(Math.random() * QZ_PIKACHU.length)];
  const el = document.getElementById('qzCelebration');
  const img = document.getElementById('qzCelebImg');
  img.src = ''; // force re-animation
  requestAnimationFrame(() => {
    img.src = src;
    document.getElementById('qzCelebChar').textContent = char;
    el.classList.add('show');
  });
  qzLaunchConfetti();
  qzCelebTimeout = setTimeout(qzHideCelebration, 2800);
}
function qzHideCelebration() {
  clearTimeout(qzCelebTimeout);
  document.getElementById('qzCelebration').classList.remove('show');
  document.querySelectorAll('.qz-confetti').forEach(el => el.remove());
  if (qzIdx >= qzQuestions.length) qzShowScore();
  else qzShow();
}
function qzLaunchConfetti() {
  const colors = ['#f06292','#ffb6c1','#FFD700','#6BCB77','#4D96FF','#a78bfa','#fb923c','#34d399'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'qz-confetti';
    el.style.cssText = `left:${Math.random()*100}vw;top:-20px;` +
      `background:${colors[i % colors.length]};` +
      `width:${7+Math.random()*8}px;height:${7+Math.random()*8}px;` +
      `border-radius:${Math.random()>.5?'50%':'2px'};` +
      `animation-duration:${1.6+Math.random()*2}s;` +
      `animation-delay:${Math.random()*.6}s;`;
    document.body.appendChild(el);
  }
  setTimeout(() => document.querySelectorAll('.qz-confetti').forEach(el => el.remove()), 4500);
}

// ── 成功音效 (Web Audio API) ──
function qzPlaySuccess() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.36]].forEach(([freq,t]) => {
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      const st = ac.currentTime + t;
      gain.gain.setValueAtTime(0, st);
      gain.gain.linearRampToValueAtTime(0.28, st+.05);
      gain.gain.exponentialRampToValueAtTime(0.001, st+.48);
      osc.start(st); osc.stop(st+.5);
    });
  } catch(e) {}
}
